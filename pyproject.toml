[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "reservation-service"
version = "0.1.0"
description = "Sistema serverless de reservas para eventos de alta demanda"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.35,<2.0",
    "aws-lambda-powertools>=3.0,<4.0",
    "fastapi>=0.115,<1.0",
    "mangum>=0.19,<1.0",
    "pydantic>=2.9,<3.0",
]

[tool.uv]
default-groups = ["dev"]

[dependency-groups]
dev = [
    "httpx>=0.27,<1.0",
    "mypy>=1.13,<2.0",
    "pytest>=8.3,<9.0",
    "pytest-cov>=5.0,<6.0",
    "ruff>=0.8,<1.0",
]

[tool.setuptools.packages.find]
include = ["reservation_service*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --strict-config"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
