name: Deploy Dev

on:
  workflow_dispatch:
  push:
    branches: [develop]
    paths:
      - "reservation_service/**"
      - "infra/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".python-version"

permissions:
  id-token: write
  contents: read

concurrency:
  group: terraform-dev
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: dev
    defaults:
      run:
        working-directory: infra/environments/dev
    steps:
      - uses: actions/checkout@v5
      - name: Validate OIDC role configuration
        env:
          ROLE_ARN: ${{ secrets.AWS_GITHUB_ACTIONS_ROLE_ARN }}
        run: |
          set -euo pipefail

          if [ -z "$ROLE_ARN" ]; then
            echo "AWS_GITHUB_ACTIONS_ROLE_ARN is empty in environment dev."
            exit 1
          fi

          case "$ROLE_ARN" in
            arn:aws:iam::596929569173:role/*)
              echo "OIDC role account: 596929569173"
              echo "OIDC role name: ${ROLE_ARN##*/}"
              ;;
            *)
              echo "AWS_GITHUB_ACTIONS_ROLE_ARN does not contain the expected role ARN format."
              echo "Expected: arn:aws:iam::596929569173:role/<role-name>"
              exit 1
              ;;
          esac
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: us-east-1
          audience: sts.amazonaws.com
          role-to-assume: ${{ secrets.AWS_GITHUB_ACTIONS_ROLE_ARN }}
      - name: Import existing Lambda log groups
        run: |
          set -euo pipefail

          for function_name in api payment expiration notification analytics; do
            log_group_name="/aws/lambda/reservation-service-dev-$function_name"
            resource_address="module.compute.aws_cloudwatch_log_group.lambda[\"$function_name\"]"

            if terraform state show "$resource_address" >/dev/null 2>&1; then
              continue
            fi

            if aws logs describe-log-groups \
              --log-group-name-prefix "$log_group_name" \
              --query "logGroups[?logGroupName=='$log_group_name'] | length(@)" \
              --output text | grep -qx "1"; then
              terraform import -input=false "$resource_address" "$log_group_name"
            fi
          done
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.16.1"
      - name: Initialize
        run: terraform init -input=false -backend-config="bucket=${{ vars.TERRAFORM_STATE_BUCKET || secrets.TERRAFORM_STATE_BUCKET }}" -backend-config="region=us-east-1"
      - name: Validate
        run: terraform validate
      - name: Plan
        run: terraform plan -input=false -out=tfplan
      - name: Apply reviewed plan
        run: terraform apply -input=false -auto-approve tfplan
