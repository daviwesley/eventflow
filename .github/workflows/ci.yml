name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked --all-groups
      - name: Ruff
        run: uv run ruff check .
      - name: Type check
        run: uv run mypy reservation_service
      - name: Tests
        run: uv run pytest
